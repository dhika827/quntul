<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background-color: #ffe6e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 { color: #ff4d6d; }
        p { color: #555; font-size: 18px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>System.out.println("Aku Sayang Kamu!");</h1>
        <p>Dari sekian banyak baris kode di dunia, kamu adalah satu-satunya favoritku. ❤️</p>
    </div>
</body>
</html>
